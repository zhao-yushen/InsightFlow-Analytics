name: CI
on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m compileall -q src scripts tests streamlit_app.py
      - run: ruff check src tests scripts streamlit_app.py
      - run: pytest --cov=src/insightflow --cov-report=term-missing --cov-fail-under=80 -q
      - run: bandit -q -r src -x src/insightflow/pages
      - run: pip-audit

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t insightflow:${{ github.sha }} .
