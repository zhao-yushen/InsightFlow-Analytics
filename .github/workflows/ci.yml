name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality and Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
         run: |
         python -m pip install --upgrade pip "setuptools>=83.0.0" wheel
         python -m pip install -e ".[dev]"

      - name: Compile source
        run: python -m compileall -q src scripts tests streamlit_app.py

      - name: Run Ruff
        run: python -m ruff check src tests scripts streamlit_app.py

      - name: Run tests
        run: python -m pytest --cov=src/insightflow --cov-report=term-missing --cov-fail-under=80 -q

      - name: Check high-severity security findings
        run: python -m bandit -q -r src -x src/insightflow/pages -lll -ii

     - name: Audit dependencies
        run: python -m pip_audit --skip-editable
