[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insightflow"
version = "0.4.3.3"
description = "Trust-aware business analytics, experimentation and probabilistic decision support platform"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Zhao Yushen"}]
dependencies = [
  "pandas>=2.1,<3",
  "numpy>=1.26,<3",
  "plotly>=5.20,<7",
  "streamlit>=1.40,<2",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "xlrd>=2.0,<3",
  "pyarrow>=15,<23",
  "jinja2>=3.1,<4",
  "tabulate>=0.9,<1",
  "python-dotenv>=1.0,<2",
  "openai>=1.50,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "bandit>=1.7,<2",
  "pip-audit>=2.7,<3",
]

[project.scripts]
insightflow = "insightflow.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/insightflow"]
omit = ["src/insightflow/pages/*", "src/insightflow/ui.py", "src/insightflow/cli.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# CI baseline: syntax/import correctness first. More opinionated B/UP rules can be
# enabled incrementally after the portfolio release is stable.
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# These entry scripts intentionally add the local src directory before importing
# the package, so E402 is expected and documented.
"streamlit_app.py" = ["E402"]
"scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
